# Testar och bygger Motiv på GitHub.
# - Vid varje push och pull request: testerna körs, och Windows- och
#   Linux-paket byggs och kan laddas ned under "Artifacts" i körningen.
# - När en versionstagg pushas (t.ex. v0.3.0) skapas också en release
#   med installationsfilerna.
name: Test och bygge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  windows:
    name: Windows (.msi och .exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: motiv-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux (.deb och AppImage)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Systempaket
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb appimage
      - uses: actions/upload-artifact@v4
        with:
          name: motiv-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paket
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Motiv ${{ github.ref_name }}
          # Paketen ligger i undermappar (msi/, nsis/, deb/, appimage/)
          files: paket/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
