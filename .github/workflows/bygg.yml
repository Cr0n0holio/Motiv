# Testar och bygger Motiv på GitHub.
# - Vid varje push och pull request körs testerna (snabbt, ett par minuter).
# - Windows- och Linux-paketen byggs bara när en versionstagg pushas
#   (t.ex. v0.4.0) eller när arbetsflödet startas för hand under Actions.
#   Det sparar byggminuter.
# - En versionstagg skapar en release med installationsfilerna och
#   latest.json, som appen läser för att hitta och installera uppdateringar.
#   Paketen signeras med nyckeln i hemligheten TAURI_SIGNING_PRIVATE_KEY.
name: Test och bygge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  windows:
    name: Windows (.msi och .exe)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --config tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: motiv-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  linux:
    name: Linux (.deb och AppImage)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Systempaket
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb appimage --config tauri.release.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: motiv-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paket
          merge-multiple: true
      - name: latest.json för uppdateringar
        run: node verktyg/latest-json.mjs paket ${{ github.ref_name }} ${{ github.repository }}
      - uses: softprops/action-gh-release@v2
        with:
          name: Motiv ${{ github.ref_name }}
          # Paketen ligger i undermappar (msi/, nsis/, deb/, appimage/)
          files: paket/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
