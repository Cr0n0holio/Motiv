[package]
name = "ediholio"
version = "0.1.0"
description = "Ediholio – en Canva-inspirerad editor för posters och bilder"
authors = ["Micke"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native fildialoger (Spara/Öppna)
rfd = "0.15"
# Bildavkodning/kodning för bakgrundsborttagning
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
# Nedladdning av Google Fonts och AI-modeller
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Ren Rust ONNX-motor för bakgrundsborttagning (inga externa DLL:er)
tract-onnx = "0.21"
# SVG -> PDF (vektor) för tryckexport. Re-exporterar usvg och fontdb.
svg2pdf = "0.13"

[features]
# custom-protocol bäddar in ui/-mappen i exe-filen så att `cargo run` fungerar direkt.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true

# AI-motorn (tract) och PDF är mycket långsamma i debug-läge,
# så beroenden optimeras även i dev-bygget.
[profile.dev.package."*"]
opt-level = 3
